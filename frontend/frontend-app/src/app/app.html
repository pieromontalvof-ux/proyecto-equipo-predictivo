<div class="app">
  <header>
    <h1>Clasificador de Tumores Cerebrales</h1>

    <div class="formulario">
      <input type="file" accept="image/*" (change)="onFileSelected($event)">
      <button (click)="subirImagen()">Clasificar Imagen</button>
    </div>
  </header>

  <main class="content">
    <section class="left">
      <div class="card" *ngIf="imagenPreview">
        <h2>Imagen Analizada</h2>
        <img [src]="imagenPreview" alt="MRI" class="preview-img">
      </div>

      <div class="card result-card" *ngIf="resultado">
        <h2>Resultado</h2>
        <p class="prediction">{{ resultado }}</p>
      </div>
    </section>

    <section class="right" *ngIf="probs">
      <div class="card" *ngIf="graphUrl">
        <h2>Gráfico de Probabilidades</h2>
        <img [src]="graphUrl" alt="Gráfico de probabilidades" class="chart-img">
      </div>

      <div class="card">
        <h2>Detalles por Clase</h2>

        <table>
          <thead>
            <tr>
              <th>Clase</th>
              <th>Probabilidad</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let item of getProbabilidades()">
              <td>{{ item[0] }}</td>
              <td>{{ (item[1] * 100).toFixed(2) }}%</td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>
  </main>
</div>
